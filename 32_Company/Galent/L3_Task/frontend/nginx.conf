server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to dashboard backend
    location /fleet { proxy_pass http://dashboard-api:8000; }
    location /alerts { proxy_pass http://dashboard-api:8000; }
    location /vehicles { proxy_pass http://dashboard-api:8000; }
    location /depots { proxy_pass http://dashboard-api:8000; }

    # Proxy WebSocket
    location /ws/ {
        proxy_pass http://dashboard-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
